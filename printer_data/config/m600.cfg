[gcode_macro M600]
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    {% set E = params.E|default(-5)|float %}

    SAVE_GCODE_STATE NAME=M600_state
    PAUSE

    G91
    G1 E-5 F3000
    G1 Z{Z}
    G90

    G1 X{X} Y{Y} F3000

    G91
    G1 E{E} F600
    G90

    M300