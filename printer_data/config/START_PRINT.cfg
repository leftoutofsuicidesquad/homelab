```ini
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    G90
    M83
    M107
    G92 E0

    # Bett auf Drucktemperatur bringen
    M140 S{BED_TEMP}

    # Hotend vorheizen, aber noch nicht auf volle Drucktemperatur
    # verhindert starkes Oozing während des Meshings
    M104 S150

    # Bett vollständig aufheizen
    M190 S{BED_TEMP}

    # Zuerst homen
    G28

    # Adaptives Bed Mesh anhand der Objekt-Daten des Slicers
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Hotend auf endgültige Drucktemperatur
    M109 S{EXTRUDER_TEMP}

    # Extruder zurücksetzen
    G92 E0

    # KAMP Adaptive Line Purge
    LINE_PURGE

    # Extruderposition erneut auf 0 setzen
    G92 E0
```
