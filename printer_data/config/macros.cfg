[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    G90
    M83
    M107
    G92 E0

    M140 S{BED_TEMP}
    M104 S150

    M190 S{BED_TEMP}

    G28

    BED_MESH_CALIBRATE ADAPTIVE=1

    M109 S{EXTRUDER_TEMP}

    G92 E0
    LINE_PURGE
    G92 E0


[gcode_macro END_PRINT]
gcode:
    M400

    G91
    G1 E-2 F1800
    G1 Z5 F3000

    G90
    G1 X10 Y320 F6000

    M104 S0
    M140 S0
    M106 S0

    M84