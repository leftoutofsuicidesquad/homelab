[gcode_macro TEST_SPEED]
description: Speed/Accel test macro

gcode:

    {% set speed = params.SPEED|default(printer.configfile.config["printer"]["max_velocity"])|int %}
    {% set accel = params.ACCEL|default(printer.configfile.config["printer"]["max_accel"])|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(30)|int %}
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = printer.toolhead.axis_minimum.y + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    {% set x_center = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}

    {% set x_center_min = x_center - (smallpatternsize / 2) %}
    {% set x_center_max = x_center + (smallpatternsize / 2) %}
    {% set y_center_min = y_center - (smallpatternsize / 2) %}
    {% set y_center_max = y_center + (smallpatternsize / 2) %}

    SAVE_GCODE_STATE NAME=TEST_SPEED

    M400
    G28

    {% if printer.configfile.settings.quad_gantry_level is defined %}
        {% if printer.quad_gantry_level.applied == False %}
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}
    {% endif %}

    G90
    G0 X{x_max-10} Y{y_max-10} F3000
    M400
    G28 X Y
    G4 P1000
    GET_POSITION

    G0 X{x_min} Y{x_min} Z{bound + 10} F{speed * 60}

    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}

    {% for i in range(iterations) %}
        G0 X{x_min} Y{x_min} F{speed * 60}
        G0 X{x_max} Y{x_max} F{speed * 60}
        G0 X{x_min} Y{x_max} F{speed * 60}
        G0 X{x_max} Y{x_min} F{speed * 60}

        G0 X{x_center_min} Y{x_center_min} F{speed * 60}
        G0 X{x_center_max} Y{x_center_max} F{speed * 60}
    {% endfor %}

    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.config["printer"]["max_velocity"]} ACCEL={printer.configfile.config["printer"]["max_accel"]}

    M400
    G28
    G90
    G0 X{x_max-1} Y{x_max-1} F3000
    G4 P1000
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_SPEED